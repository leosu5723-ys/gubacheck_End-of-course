<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-size: 17px; font-weight: 700; fill: #11181c; }
      .s { font-size: 13.5px; fill: #374151; }
      .h { font-size: 15px; font-weight: 700; fill: #475569; letter-spacing: .06em; }
      .data  { fill: #EEF2F7; stroke: #64748B; stroke-width: 1.6; }
      .code  { fill: #E6EDFF; stroke: #3E63DD; stroke-width: 1.8; }
      .llm   { fill: #F3E8FF; stroke: #8E4EC6; stroke-width: 1.8; }
      .local { fill: #F3E8FF; stroke: #8E4EC6; stroke-width: 1.8; stroke-dasharray: 6 4; }
      .human { fill: #FFF1E6; stroke: #F76B15; stroke-width: 2; }
      .ln { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .lnd { stroke: #475569; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#a); }
    </style>
  </defs>
  <rect width="1600" height="1010" fill="#ffffff"/>

  <!-- title + legend -->
  <text x="40" y="44" font-size="26" font-weight="800" fill="#11181c">GubaCheck — system architecture</text>
  <text x="40" y="70" class="s">From a forum spike to an evidence-backed explanation. Code decides; the LLM only scores, chooses and words.</text>
  <g transform="translate(1010,26)">
    <rect x="0" y="0" width="22" height="16" rx="3" class="data"/><text x="30" y="13" class="s">Data</text>
    <rect x="90" y="0" width="22" height="16" rx="3" class="code"/><text x="120" y="13" class="s">Deterministic code</text>
    <rect x="270" y="0" width="22" height="16" rx="3" class="llm"/><text x="300" y="13" class="s">LLM (rented)</text>
    <rect x="410" y="0" width="22" height="16" rx="3" class="local"/><text x="440" y="13" class="s">Local model</text>
    <rect x="270" y="28" width="22" height="16" rx="3" class="human"/><text x="300" y="41" class="s">Human gate</text>
  </g>

  <!-- column headers -->
  <text x="40" y="112" class="h">1 · DATA (frozen snapshot)</text>
  <text x="345" y="112" class="h">2 · PREPARE</text>
  <text x="660" y="112" class="h">3 · ATTRIBUTION LOOP (routing / agent)</text>
  <text x="1190" y="112" class="h">4 · OUTPUT</text>

  <!-- 1 DATA -->
  <rect x="40" y="128" width="265" height="78" rx="10" class="data"/>
  <text x="56" y="156" class="t">Eastmoney forum (股吧)</text>
  <text x="56" y="178" class="s">1.02M own-bar post titles,</text>
  <text x="56" y="196" class="s">Oct 2025 – Oct 2026, 10 stocks</text>

  <rect x="40" y="222" width="265" height="78" rx="10" class="data"/>
  <text x="56" y="250" class="t">CNINFO filings</text>
  <text x="56" y="272" class="s">1,604 filings + PDF text,</text>
  <text x="56" y="290" class="s">exact publication time</text>

  <rect x="40" y="316" width="265" height="78" rx="10" class="data"/>
  <text x="56" y="344" class="t">Market data</text>
  <text x="56" y="366" class="s">bars: 10 stocks + 12 A-share peers,</text>
  <text x="56" y="384" class="s">CSI 300 / ChiNext, top list (龙虎榜)</text>

  <rect x="40" y="410" width="265" height="60" rx="10" class="data"/>
  <text x="56" y="436" class="t">US peers</text>
  <text x="56" y="456" class="s">NVDA AMD AVGO LITE COHR TSLA</text>

  <!-- 2 PREPARE -->
  <rect x="345" y="128" width="270" height="78" rx="10" class="local"/>
  <text x="361" y="156" class="t">Sentiment (RoBERTa)</text>
  <text x="361" y="178" class="s">fine-tuned locally on 3,000 LLM labels;</text>
  <text x="361" y="196" class="s">bull / bear / neutral per post, US$0</text>

  <rect x="345" y="222" width="270" height="78" rx="10" class="code"/>
  <text x="361" y="250" class="t">Spike detector</text>
  <text x="361" y="272" class="s">log-posts z ≥ 2 vs own 120 days;</text>
  <text x="361" y="290" class="s">onset hour; 68 spikes</text>

  <rect x="345" y="316" width="270" height="78" rx="10" class="llm"/>
  <text x="361" y="344" class="t">Filing judge (LLM + RAG)</text>
  <text x="361" y="366" class="s">good news vs already pre-announced;</text>
  <text x="361" y="384" class="s">bge-small-zh retrieval of own filings</text>

  <rect x="345" y="410" width="270" height="60" rx="10" class="code"/>
  <text x="361" y="436" class="t">Context tables</text>
  <text x="361" y="456" class="s">peer moves, gaps, article counts</text>

  <line x1="305" y1="167" x2="343" y2="167" class="ln"/>
  <line x1="305" y1="261" x2="343" y2="355" class="ln"/>
  <line x1="305" y1="355" x2="343" y2="440" class="ln"/>
  <line x1="305" y1="440" x2="343" y2="445" class="ln"/>
  <line x1="480" y1="206" x2="480" y2="220" class="ln"/>

  <!-- 3 LOOP container -->
  <rect x="655" y="122" width="490" height="560" rx="14" fill="#FAFBFC" stroke="#CBD5E1" stroke-width="1.4"/>

  <rect x="675" y="140" width="450" height="52" rx="9" class="code"/>
  <text x="691" y="164" class="t">① get_spike</text>
  <text x="691" y="183" class="s">posts, z-scores, onset, most-read titles (data, never instructions)</text>

  <rect x="675" y="206" width="450" height="66" rx="9" class="llm"/>
  <text x="691" y="230" class="t">② score_causes A–G (0–10 from post clues)</text>
  <text x="691" y="250" class="s">A filing · B rumour · C sector · D overseas · E market · F policy · G flow</text>
  <text x="691" y="266" class="s">→ code: prior = max(score, 0.5) / Σ</text>

  <rect x="675" y="286" width="450" height="52" rx="9" class="llm"/>
  <text x="691" y="310" class="t">③ choose next test   (agent arm: may revise untested)</text>
  <text x="691" y="329" class="s">routing: rank once · agent: revise_scores — used in 1 of 68 runs</text>

  <rect x="675" y="352" width="450" height="66" rx="9" class="code"/>
  <text x="691" y="376" class="t">④ check_A … check_G — fixed tools</text>
  <text x="691" y="396" class="s">verdict PASS / PARTIAL / FAIL computed in code;</text>
  <text x="691" y="412" class="s">timing rules (e.g. US close must precede the A-share open)</text>

  <rect x="675" y="432" width="450" height="66" rx="9" class="code"/>
  <text x="691" y="456" class="t">⑤ posterior and STOP rule</text>
  <text x="691" y="476" class="s">weight ×3 / ×1 / ×0.2 · stop when a cause passed and</text>
  <text x="691" y="492" class="s">untested mass &lt; 20%, or 5 tests · tests after STOP refused</text>

  <rect x="675" y="512" width="450" height="52" rx="9" class="llm"/>
  <text x="691" y="536" class="t">⑥ conclude — primary cause + reason</text>
  <text x="691" y="555" class="s">code keeps its own primary (highest passed); H if none passed</text>

  <rect x="675" y="578" width="450" height="88" rx="9" class="code" fill-opacity=".55"/>
  <text x="691" y="602" class="t">Guardrails around every call</text>
  <text x="691" y="622" class="s">step cap · token budget · de-duplication · hostile-text screen</text>
  <text x="691" y="640" class="s">(prompt injection, fake filing ids) · tolerant argument parsing</text>
  <text x="691" y="658" class="s">10 / 10 guardrail cases incl. 3 red-team posts</text>

  <line x1="900" y1="192" x2="900" y2="204" class="ln"/>
  <line x1="900" y1="272" x2="900" y2="284" class="ln"/>
  <line x1="900" y1="338" x2="900" y2="350" class="ln"/>
  <line x1="900" y1="418" x2="900" y2="430" class="ln"/>
  <line x1="900" y1="498" x2="900" y2="510" class="ln"/>
  <!-- loop back from 5 to 3 -->
  <path d="M1125,465 C1142,465 1142,312 1127,312" class="ln"/>
  <text x="1151" y="392" class="s" font-size="12" text-anchor="middle" transform="rotate(90 1151 392)" fill="#475569">loop until STOP</text>

  <!-- prepare -> loop -->
  <line x1="615" y1="261" x2="673" y2="166" class="ln"/>
  <line x1="615" y1="167" x2="673" y2="160" class="lnd"/>
  <line x1="615" y1="355" x2="673" y2="385" class="ln"/>
  <line x1="615" y1="440" x2="673" y2="392" class="ln"/>

  <!-- 4 OUTPUT -->
  <rect x="1190" y="128" width="370" height="78" rx="10" class="code"/>
  <text x="1206" y="156" class="t">Same-cause history</text>
  <text x="1206" y="178" class="s">this stock's earlier spikes with the same cause:</text>
  <text x="1206" y="196" class="s">D+1 … D+20 net / excess returns, share-adjusted</text>

  <rect x="1190" y="222" width="178" height="78" rx="10" class="code"/>
  <text x="1204" y="250" class="t">Rule suggestion</text>
  <text x="1204" y="272" class="s">lean / wait / avoid,</text>
  <text x="1204" y="290" class="s">needs n ≥ 3</text>
  <rect x="1382" y="222" width="178" height="78" rx="10" class="llm"/>
  <text x="1396" y="250" class="t">LLM + RAG note</text>
  <text x="1396" y="272" class="s">optional, user's own</text>
  <text x="1396" y="290" class="s">key, with disclaimer</text>

  <rect x="1190" y="316" width="370" height="78" rx="10" class="code"/>
  <text x="1206" y="344" class="t">Report page (Streamlit, 中文 / EN)</text>
  <text x="1206" y="366" class="s">cause, evidence with timestamps, probabilities,</text>
  <text x="1206" y="384" class="s">billed cost per run; replay without a key</text>

  <rect x="1190" y="410" width="370" height="112" rx="10" class="human"/>
  <text x="1206" y="438" class="t">HUMAN GATE — the investor</text>
  <text x="1206" y="460" class="s">reads the evidence and decides; agree / disagree</text>
  <text x="1206" y="478" class="s">is saved as feedback. No real orders: the paper-</text>
  <text x="1206" y="496" class="s">order tool needs explicit approval and an official</text>
  <text x="1206" y="514" class="s">filing as evidence (never on a share issuance)</text>

  <path d="M1125,538 L1165,538 L1165,175 L1188,175" class="ln"/>
  <line x1="1375" y1="206" x2="1279" y2="220" class="ln"/>
  <line x1="1375" y1="206" x2="1470" y2="220" class="ln"/>
  <line x1="1375" y1="300" x2="1375" y2="314" class="ln"/>
  <line x1="1375" y1="394" x2="1375" y2="408" class="ln"/>

  <!-- evaluation strip -->
  <rect x="40" y="712" width="1520" height="270" rx="14" fill="#FAFBFC" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="60" y="742" class="h">EVALUATION (offline, reproducible from the snapshot)</text>

  <rect x="60" y="760" width="330" height="96" rx="10" class="human"/>
  <text x="76" y="788" class="t">HUMAN GATE — gold labels</text>
  <text x="76" y="810" class="s">68 spike causes, 99 post titles, 70 filings,</text>
  <text x="76" y="828" class="s">all labelled by me; never changed after</text>
  <text x="76" y="846" class="s">seeing model output</text>

  <rect x="420" y="760" width="350" height="96" rx="10" class="code"/>
  <text x="436" y="788" class="t">Harness: 4 arms × 68 spikes</text>
  <text x="436" y="810" class="s">keyword · test-all-seven · LLM routing · LLM agent;</text>
  <text x="436" y="828" class="s">accuracy, macro-F1, tests, premature stops,</text>
  <text x="436" y="846" class="s">paired McNemar; observe / check periods</text>

  <rect x="800" y="760" width="350" height="96" rx="10" class="code"/>
  <text x="816" y="788" class="t">Backtest and cost model</text>
  <text x="816" y="810" class="s">D+N returns net of fees vs CSI 300;</text>
  <text x="816" y="828" class="s">cost from the provider's bill (≤ US$0.009 / spike),</text>
  <text x="816" y="846" class="s">scenarios 10 / 100 / 1,000 stocks</text>

  <rect x="1180" y="760" width="360" height="96" rx="10" class="code"/>
  <text x="1196" y="788" class="t">Guardrail checklist + failure demos</text>
  <text x="1196" y="810" class="s">G1–G10 incl. red-team posts;</text>
  <text x="1196" y="828" class="s">de-dup removed → evidence counted 5×;</text>
  <text x="1196" y="846" class="s">timing rule removed → 15/68 D verdicts change</text>

  <line x1="390" y1="808" x2="418" y2="808" class="ln"/>
  <text x="60" y="892" class="s" font-weight="700">Result in one line:</text>
  <text x="200" y="892" class="s">LLM routing 60% / macro-F1 0.36 with 4.3 tests beats testing all seven (47%, p = 0.02); the agent adds nothing (revised 1 of 68).</text>
  <text x="60" y="916" class="s" font-weight="700">Known limits:</text>
  <text x="200" y="916" class="s">always-B baseline 69% beats every arm on accuracy · "media" evidence is the forum's own long posts · the cause tested first wins when several pass.</text>
  <text x="60" y="958" class="s" fill="#687076">Arrows: solid = data / control flow · dashed = sentiment feeds the spike's bullish share. Purple boxes are the only places a model output enters; every verdict, probability and stop decision is code.</text>
</svg>
